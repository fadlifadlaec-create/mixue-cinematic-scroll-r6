<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e9232c">
  <meta name="description" content="蜜雪冰城互动式甜蜜世界">
  <title>蜜雪冰城 · 甜蜜世界</title>
  <link rel="preload" as="image" media="(min-width: 1200px)" href="assets/sequences-hd/v01-clean-v5/frame_0001.webp?v=20260822-order-lab-r9">
  <link rel="preload" as="image" media="(max-width: 1199px)" href="assets/sequences/v01-clean-v5/frame_0001.webp?v=20260822-order-lab-r9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23e9232c'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='32' fill='white'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="experience" aria-live="polite">
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="poster-stack" class="poster-stack" aria-hidden="true">
      <img class="poster" alt="" decoding="async">
      <img class="poster" alt="" decoding="async">
    </div>
    <div class="v05-safe-stage" aria-hidden="true">
      <img data-src="assets/toys/v05-mix-lab-hd.webp" alt="">
    </div>

    <section id="brand-stage" class="brand-stage" aria-label="蜜雪冰城甜蜜订单">
      <picture class="brand-backdrop">
        <source media="(min-width: 1200px)" srcset="assets/sequences-hd/v01-clean-v5/frame_0001.webp?v=20260822-order-lab-r9">
        <img src="assets/sequences/v01-clean-v5/frame_0001.webp?v=20260822-order-lab-r9" alt="">
      </picture>
      <div class="brand-lockup">
        <img src="assets/brand/official-mixue-logo.svg" alt="蜜雪冰城">
        <p>一杯甜蜜，等你一起完成</p>
      </div>
      <div id="order-brief" class="order-brief" aria-label="选择今天的甜蜜订单">
        <p class="order-kicker">今日甜蜜订单</p>
        <h1>你想把哪种快乐送出去？</h1>
        <div class="order-options" role="radiogroup" aria-label="口味需求">
          <button type="button" data-order="lemon" role="radio" aria-checked="true">
            <span class="order-swatch lemon" aria-hidden="true"></span>
            <b>清爽解腻</b><small>冰鲜柠檬水</small>
          </button>
          <button type="button" data-order="grape" role="radio" aria-checked="false">
            <span class="order-swatch grape" aria-hidden="true"></span>
            <b>果香有嚼感</b><small>芋圆葡萄</small>
          </button>
          <button type="button" data-order="berry" role="radio" aria-checked="false">
            <span class="order-swatch berry" aria-hidden="true"></span>
            <b>甜润有波波</b><small>草莓波波</small>
          </button>
        </div>
        <button id="start-order" class="start-order" type="button">
          <span>接单出发</span><i aria-hidden="true">→</i>
        </button>
      </div>
    </section>

    <div class="shade" aria-hidden="true"></div>

    <div id="corner-controls" class="corner-controls">
      <img src="assets/brand/official-mixue-logo.svg" alt="蜜雪冰城">
      <button id="autoplay-toggle" class="autoplay-toggle" type="button" aria-label="暂停自动巡游" title="暂停自动巡游">
        <span aria-hidden="true">Ⅱ</span>
      </button>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-label="开启声音" aria-pressed="false" title="开启声音">
        <span aria-hidden="true">♪</span>
      </button>
    </div>

    <div id="scene-actions" class="scene-actions" aria-label="场景互动">
      <button type="button" data-scene-action="boost" data-scene="v01" aria-label="让采购车加速" title="让采购车加速"><span class="action-cone" aria-hidden="true"><i></i></span></button>
      <button type="button" data-scene-action="lemon" data-scene="v02" aria-label="接住柠檬" title="接住柠檬"><span class="action-fruit action-lemon" aria-hidden="true"></span></button>
      <button type="button" data-scene-action="grape" data-scene="v03" aria-label="收好葡萄" title="收好葡萄"><span class="action-grapes" aria-hidden="true"><i></i><i></i><i></i></span></button>
      <button type="button" data-scene-action="berry" data-scene="v04" aria-label="收好草莓" title="收好草莓"><span class="action-berry" aria-hidden="true"></span></button>
      <button type="button" data-scene-action="mix" data-scene="v05" aria-label="开始调饮" title="开始调饮"><span class="action-cup" aria-hidden="true"><i></i></span></button>
      <button type="button" data-scene-action="dance" data-scene="v06" aria-label="让雪王们一起跳舞" title="让雪王们一起跳舞"><span class="action-crown" aria-hidden="true"><i></i></span></button>
    </div>

    <div id="ingredient-tray" class="ingredient-tray" aria-hidden="true">
      <span class="tray-lemon"><i></i><b id="lemon-count">0</b></span>
      <span class="tray-grape"><i></i><b id="grape-count">0</b></span>
      <span class="tray-berry"><i></i><b id="berry-count">0</b></span>
    </div>

    <section id="mission-hud" class="mission-hud" aria-live="polite" aria-hidden="true">
      <span id="mission-step">01 / 04</span>
      <div><b id="mission-title">出发采购</b><small id="mission-copy">帮雪王把今天的原料带回店里</small></div>
      <i><b id="mission-progress"></b></i>
    </section>

    <div id="mix-bench" class="mix-bench" aria-hidden="true" inert>
      <div class="mix-choices" role="radiogroup" aria-label="根据订单选择调饮方向">
        <p><span>甜蜜调饮所</span><b id="mix-prompt">订单要：清爽解腻</b></p>
        <button type="button" data-mix="lemon" role="radio" aria-checked="false"><span class="mix-dot lemon"></span><b>鲜柠清爽</b><small>酸甜 · 解腻</small></button>
        <button type="button" data-mix="grape" role="radio" aria-checked="false"><span class="mix-dot grape"></span><b>葡萄芋圆</b><small>果香 · 嚼感</small></button>
        <button type="button" data-mix="berry" role="radio" aria-checked="false"><span class="mix-dot berry"></span><b>草莓波波</b><small>甜润 · Q弹</small></button>
      </div>
      <div class="mix-products" aria-label="调制完成的三杯真实饮品">
        <button type="button" class="mix-product" data-product="lemon" aria-label="选择真实冰鲜柠檬水" title="选择柠檬水">
          <img data-src="assets/products/real-lemonade.png" alt="真实冰鲜柠檬水">
          <span>柠檬水</span>
        </button>
        <button type="button" class="mix-product" data-product="grape" aria-label="选择真实芋圆葡萄" title="选择芋圆葡萄">
          <img data-src="assets/products/real-taro-grape.png" alt="真实芋圆葡萄">
          <span>芋圆葡萄</span>
        </button>
        <button type="button" class="mix-product" data-product="berry" aria-label="选择真实草莓波波" title="选择草莓波波">
          <img data-src="assets/products/real-strawberry-bobo.png" alt="真实草莓波波">
          <span>草莓波波</span>
        </button>
      </div>
    </div>

    <div id="final-brand" class="final-brand" aria-hidden="true">
      <strong>蜜雪冰城</strong>
    </div>
    <section id="result-card" class="result-card" aria-hidden="true" inert>
      <div class="result-copy">
        <span id="result-stamp">订单完成</span>
        <p id="result-kicker">清爽解腻的今天</p>
        <h2 id="result-name">冰鲜柠檬水</h2>
        <p id="result-reason">鲜柠的酸甜，把赶路后的燥热轻轻带走。</p>
        <div class="result-actions">
          <button id="change-order" type="button">换一张订单</button>
          <button id="replay-order" type="button" aria-label="重新走一次甜蜜采购">重新出发</button>
        </div>
      </div>
      <button id="result-product" class="result-product" type="button" aria-label="查看冰鲜柠檬水">
        <img data-src="assets/products/real-lemonade.png" alt="冰鲜柠檬水">
        <span>点一下，看看雪王庆祝</span>
      </button>
    </section>

    <div class="dance-trio" aria-hidden="true">
      <img data-src="assets/toys/snow-kings-dance-v4.png" alt="">
    </div>

    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

    <section id="caption" class="caption align-center" aria-hidden="true">
      <h1 id="title">蜜雪冰城</h1>
      <p id="copy">始于 1997 · 冰淇淋与茶</p>
    </section>

    <div id="loading" class="loading" hidden>
      <span id="loading-label">准备下一幕</span>
      <i><b id="loading-fill"></b></i>
    </div>

    <audio id="journey-score" preload="auto" autoplay playsinline src="assets/audio/mixue-authorized-cut-v8-web-full-tour.mp3"></audio>
    <p id="status" class="sr-only" aria-live="polite"></p>
  </main>
  <div id="scroll-space" aria-hidden="true"></div>

  <noscript>此体验需要启用 JavaScript。</noscript>
  <script src="config.js"></script>
  <script src="assets/sequences/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
